<VirtualHost *:8000>
    DocumentRoot "C:/xampp/htdocs/Pharmacie/public"
    ServerName localhost
    
    <Directory "C:/xampp/htdocs/Pharmacie/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        
        # Redirection vers index.php
        FallbackResource /index.php
    </Directory>
    
    # Logs
    ErrorLog "C:/xampp/apache/logs/pharmacie-error.log"
    CustomLog "C:/xampp/apache/logs/pharmacie-access.log" combined
</VirtualHost>